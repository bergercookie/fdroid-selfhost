name: Release

# Runs when a stable tag (v1.2.3) is pushed, and is called by nightly.yml for
# nightly versions (1.3.3.post1, tagged v1.3.3.post1). Builds and pushes the
# server image, then publishes a GitHub release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_call:
    inputs:
      version:
        description: Version to release, without the v prefix, e.g. 1.3.3.post1
        required: true
        type: string
      sha:
        description: Commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      sha: ${{ steps.meta.outputs.sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      image: ${{ steps.meta.outputs.image }}
      moving_tag: ${{ steps.meta.outputs.moving_tag }}
    steps:
      - id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          # Git tags have a v prefix (v1.2.3); versions and image tags do not.
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(\.post[0-9]+)?$ ]] || { echo "bad version: $version"; exit 1; }
          if [[ $version == *.post* ]]; then
            prerelease=true moving_tag=nightly
          else
            prerelease=false moving_tag=latest
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "sha=${INPUT_SHA:-$GITHUB_SHA}"
            echo "prerelease=$prerelease"
            echo "moving_tag=$moving_tag"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"

  verify:
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: ./.github/actions/setup
      - run: just ci

  image:
    needs: [meta, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.sha }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: |
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.version }}
            ${{ needs.meta.outputs.image }}:${{ needs.meta.outputs.moving_tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  release:
    needs: [meta, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
          TAG: ${{ needs.meta.outputs.tag }}
          SHA: ${{ needs.meta.outputs.sha }}
          IMAGE: ${{ needs.meta.outputs.image }}
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          Multi-arch Docker image:

          \`\`\`
          docker pull $IMAGE:$VERSION
          \`\`\`
          NOTES
          flags=(--target "$SHA" --title "$TAG" --notes-file notes.md --generate-notes)
          if [[ $PRERELEASE == true ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}"
