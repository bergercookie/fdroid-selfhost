name: Nightly

# Releases the tip of main as the next nightly (e.g. 1.3.3.post1) unless that
# commit is already tagged, i.e. nothing changed since the last release.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Release even if nothing changed since the last release
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.plan.outputs.skip }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # all tags are needed to pick the next version
      - id: plan
        env:
          FORCE: ${{ inputs.force }}
        run: |
          tags_at_head="$(git tag --points-at HEAD | tr '\n' ' ')"
          if [[ -n $tags_at_head && $FORCE != true ]]; then
            echo "Nothing to release: HEAD is already tagged ($tags_at_head)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(git tag | scripts/version.sh nightly)"
          echo "Releasing $version"
          {
            echo "skip=false"
            echo "version=$version"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  release:
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
